---
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Calendar Subscriptions</title>
  <style>html, body { background: #ffffff; margin: 0; }</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>

<header class="scout-header">
  <span class="fleur">⚜</span>
  <h1 id="header-title">Scout Calendar</h1>
</header>

<script id="main-template" type="text/ractive">
{% raw %}
  {{#if hasParams}}
    <section class="section pb-2">
      <div class="container" style="max-width: 560px;">

        {{#if availableRanks.length}}
          <div class="box">
            <p class="label mb-3">1. Select your scout's den(s)</p>
            <div class="dropdown {{dropdownOpen ? 'is-active' : ''}} is-fullwidth" id="den-dropdown">
              <div class="dropdown-trigger is-fullwidth">
                <button class="button is-fullwidth den-dropdown-btn" on-click="toggleDropdown">
                  <span class="den-dropdown-label">{{dropdownLabel}}</span>
                  <span class="icon is-small ml-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5H7z"/></svg>
                  </span>
                </button>
              </div>
              <div class="dropdown-menu is-fullwidth" role="menu">
                <div class="dropdown-content">
                  {{#each availableRanks}}
                    <label class="dropdown-item den-option {{selected ? 'is-selected-item' : ''}}">
                      <input type="checkbox" checked="{{selected}}">
                      <span class="den-option-name">{{displayName}}</span>
                      <span class="has-text-grey den-option-grade">— {{grade}}</span>
                    </label>
                  {{/each}}
                </div>
              </div>
            </div>
          </div>
          {{#if !readyForNextSteps}}
            <p class="help has-text-grey has-text-centered mt-2">Select at least one den to continue.</p>
          {{/if}}
        {{/if}}

        {{#if readyForNextSteps}}
        <div class="box">
          <p class="label mb-3">{{availableRanks.length ? '2.' : '1.'}} Choose your calendar app & subscribe</p>
          <div class="tabs is-toggle is-fullwidth mb-0 app-tabs">
            <ul>
              <li class="{{app === 'apple' ? 'is-active' : ''}}">
                <a on-click="@this.set('app', 'apple')">
                  <span class="icon is-small"><img src="https://api.iconify.design/logos:apple.svg" alt=""></span>
                  <span>Apple Calendar</span>
                </a>
              </li>
              <li class="{{app === 'google' ? 'is-active' : ''}}">
                <a on-click="@this.set('app', 'google')">
                  <span class="icon is-small"><img src="https://api.iconify.design/logos:google-icon.svg" alt=""></span>
                  <span>Google Calendar</span>
                </a>
              </li>
              <li class="{{app === 'outlook' ? 'is-active' : ''}}">
                <a on-click="@this.set('app', 'outlook')">
                  <span class="icon is-small"><img src="https://api.iconify.design/vscode-icons:file-type-outlook.svg" alt=""></span>
                  <span>Outlook</span>
                </a>
              </li>
            </ul>
          </div>
          <div class="app-tab-panel">
          <div class="buttons is-flex-direction-column">
            {{#if packUrl}}
              {{#if app === 'apple'}}
                <a class="button is-primary is-fullwidth cal-btn" href="{{packCalLink}}">
                  <span class="icon cal-btn-icon"><img src="{{packBtnIconUrl}}" alt=""></span>
                  <span>
                    <span class="cal-btn-title">Add Pack Calendar</span>
                    <span class="cal-btn-sub">All pack-wide events and activities</span>
                  </span>
                </a>
              {{else}}
                <a class="button is-primary is-fullwidth cal-btn" href="{{packCalLink}}" target="_blank" rel="noopener">
                  <span class="icon cal-btn-icon"><img src="{{packBtnIconUrl}}" alt=""></span>
                  <span>
                    <span class="cal-btn-title">Add Pack Calendar</span>
                    <span class="cal-btn-sub">All pack-wide events and activities</span>
                  </span>
                </a>
              {{/if}}
            {{/if}}
            {{#each selectedRanks}}
              {{#if hasCalendar}}
                {{#if ~/app === 'apple'}}
                  <a class="button is-info is-fullwidth cal-btn" href="{{denCalLink}}">
                    <span class="icon cal-btn-icon"><img src="{{~/denBtnIconUrl}}" alt=""></span>
                    <span>
                      <span class="cal-btn-title">Add {{displayName}} Calendar</span>
                      <span class="cal-btn-sub">{{grade}} den meetings and events</span>
                    </span>
                  </a>
                {{else}}
                  <a class="button is-info is-fullwidth cal-btn" href="{{denCalLink}}" target="_blank" rel="noopener">
                    <span class="icon cal-btn-icon"><img src="{{~/denBtnIconUrl}}" alt=""></span>
                    <span>
                      <span class="cal-btn-title">Add {{displayName}} Calendar</span>
                      <span class="cal-btn-sub">{{grade}} den meetings and events</span>
                    </span>
                  </a>
                {{/if}}
              {{else}}
                <button class="button is-fullwidth cal-btn cal-btn-tbd" disabled>
                  <span class="icon cal-btn-icon"><img src="https://api.iconify.design/mdi:calendar-clock-outline.svg?color=%23999999" alt=""></span>
                  <span>
                    <span class="cal-btn-title">{{displayName}} Calendar</span>
                    <span class="cal-btn-sub">TBD — not published yet</span>
                  </span>
                </button>
              {{/if}}
            {{/each}}
          </div>
          {{#if appNote}}
            <p class="help has-text-grey mt-2">{{appNote}}</p>
          {{/if}}
          </div>
        </div>
        {{/if}}

        {{#if readyForNextSteps && hasAnyDocs}}
        <div class="box">
          <p class="label mb-3">{{docsStepLabel}} See the full year at a glance</p>
          <div class="buttons is-flex-direction-column">
            {{#if packDocUrl}}
              <a class="button is-link is-fullwidth cal-btn" href="{{packDocUrl}}" target="_blank" rel="noopener">
                <span class="icon cal-btn-icon"><img src="https://api.iconify.design/mdi:file-document-outline.svg?color=%23003F87" alt=""></span>
                <span>
                  <span class="cal-btn-title">Pack Year at a Glance</span>
                  <span class="cal-btn-sub">Full-year plan for the whole pack</span>
                </span>
              </a>
            {{/if}}
            {{#each selectedDocs}}
              <a class="button is-link is-fullwidth cal-btn" href="{{docUrl}}" target="_blank" rel="noopener">
                <span class="icon cal-btn-icon"><img src="https://api.iconify.design/mdi:file-document-outline.svg?color=%23003F87" alt=""></span>
                <span>
                  <span class="cal-btn-title">{{label}} Year at a Glance</span>
                  <span class="cal-btn-sub">{{grade}} full-year plan</span>
                </span>
              </a>
            {{/each}}
          </div>
        </div>
        {{/if}}

      </div>
    </section>
  {{else}}
    <section class="section">
      <div class="container">
        <div class="no-params-box">
          <span class="fleur-lg">⚜</span>
          <p class="title is-5">No calendar configured</p>
          <p class="subtitle is-6">Ask your den leader for a subscription link or QR code.</p>
        </div>
      </div>
    </section>
  {{/if}}
{% endraw %}
</script>

<div id="app"></div>

<footer class="footer">
  <p>Calendar subscriptions powered by <a href="https://advancements.scouting.org/" target="_blank">Scoutbook+</a></p>
  <div class="has-text-centered mt-2">
    <a href="{{ site.github.repository_url }}" target="_blank" title="View on GitHub"
      style="display: inline-flex; align-items: center;">
      <img src="https://img.shields.io/badge/github-{{ site.github.repository_name | replace: '-', '--' }}-blue?logo=github"
        alt="GitHub Repo Badge">
    </a>
    <a href="{{ site.github.repository_url }}/commit/{{ site.github.build_revision }}" target="_blank"
      title="Build {{ site.github.build_revision | default: 'dev' }}"
      style="display: inline-flex; align-items: center; margin-left: 0.4em;">
      <img src="https://img.shields.io/badge/build-{{ site.github.build_revision | default: 'dev' | slice: 0, 7 }}-lightgrey"
        alt="Build version badge">
    </a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/ractive@1.4.4/ractive.min.js"></script>
<script type="module" src="{{ '/main.js' | relative_url }}?v={{ site.github.build_revision }}"></script>
</body>
</html>
