---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Subscription Link</title>
  <style>html, body { background: #ffffff; margin: 0; }</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>

<header class="scout-header">
  <span class="fleur">⚜</span>
  <h1>Generate Subscription Link</h1>
</header>

<script id="generator-template" type="text/ractive">
{% raw %}
  <section class="section pb-2">
    <div class="container" style="max-width: 560px;">

      <div class="box">
        <h2 class="title is-6 mb-3">Pack</h2>
        <div class="field">
          <label class="label is-small">Pack Scoutbook ID <span class="has-text-grey-light">(from the calendar URL, not your pack number)</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="e.g. 12390" value="{{packNumber}}">
          </div>
        </div>
        <div class="field mb-0">
          <label class="label is-small">Pack Name</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="e.g. Pack 3721" value="{{packName}}">
          </div>
        </div>
      </div>

      <div class="box">
        <h2 class="title is-6 mb-1">Den Numbers</h2>
        <p class="help mb-4">Enter the last number from each den's Scoutbook calendar URL. Leave blank if no calendar yet.</p>
        <div class="field">
          <label class="label is-small">Lion <span class="has-text-grey-light">— Kindergarten</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="Den number" value="{{lionNum}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Tiger <span class="has-text-grey-light">— 1st Grade</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="Den number" value="{{tigerNum}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Wolf <span class="has-text-grey-light">— 2nd Grade</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="Den number" value="{{wolfNum}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Bear <span class="has-text-grey-light">— 3rd Grade</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="Den number" value="{{bearNum}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Webelos <span class="has-text-grey-light">— 4th Grade</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="Den number" value="{{webelosNum}}">
          </div>
        </div>
        <div class="field mb-0">
          <label class="label is-small">Arrow of Light <span class="has-text-grey-light">— 5th Grade</span></label>
          <div class="control">
            <input class="input is-small" type="number" placeholder="Den number" value="{{aolNum}}">
          </div>
        </div>
      </div>

      <div class="box">
        <h2 class="title is-6 mb-3">Your Link</h2>
        {{#if hasOutput}}
          <div class="url-display mb-3">{{generatedUrl}}</div>
          <button class="button is-small is-light" id="copy-btn" on-click="copy">Copy Link</button>
          <div class="qr-wrap mt-4">
            <img src="{{qrUrl}}" width="200" height="200" alt="QR code for subscription link">
          </div>
          <p class="help has-text-centered mt-2">Share or print this QR code — families pick their own rank(s)</p>
        {{else}}
          <p class="has-text-grey is-size-6">Enter a pack number above to generate a link.</p>
        {{/if}}
      </div>

    </div>
  </section>
{% endraw %}
</script>

<div id="app"></div>

<footer class="footer">
  <p>Calendar subscriptions powered by <a href="https://scoutbook.scouting.org" target="_blank">Scoutbook</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/ractive@1.4.4/ractive.min.js"></script>
<script src="{{ '/generate/main.js' | relative_url }}?v={{ site.github.build_revision }}"></script>
</body>
</html>
