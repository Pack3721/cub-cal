---
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Subscription Link</title>
  <style>html, body { background: #ffffff; margin: 0; }</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>

<header class="scout-header">
  <span class="fleur">⚜</span>
  <h1>Generate Subscription Link</h1>
</header>

<script id="generator-template" type="text/ractive">
{% raw %}
  <section class="section pb-2">
    <div class="container" style="max-width: 600px;">

      <div class="box">
        <h2 class="title is-6 mb-3">Pack</h2>
        <div class="field">
          <label class="label is-small">Pack Calendar URL</label>
          <div class="control">
            <input class="input is-small {{validation.pack.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX"
              value="{{packUrl}}">
          </div>
          {{#if validation.pack.cls === 'is-danger'}}
            <p class="help is-danger">Expected: https://api.scouting.org/advancements/events/calendar/{number}</p>
          {{/if}}
        </div>
        <div class="field mb-0">
          <label class="label is-small">Pack Name</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="e.g. Pack 123" value="{{packName}}">
          </div>
        </div>
      </div>

      <div class="box">
        <h2 class="title is-6 mb-1">Den Calendar URLs</h2>
        <p class="help mb-4">Paste each den's Scoutbook calendar URL. Leave blank if no calendar yet.</p>

        <div class="field">
          <div class="den-row">
            <label class="label is-small">Lion <span class="has-text-grey-light">— Kindergarten</span></label>
            <div class="den-num-wrap"><label class="label is-small">Den #</label>
            <input class="input is-small den-num" type="number" min="1" max="99" placeholder="1" value="{{lionDenNum}}"></div>
          </div>
          <div class="control">
            <input class="input is-small {{validation.lion.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
              value="{{lionUrl}}">
          </div>
          {{#if validation.lion.mismatch}}<p class="help is-danger">Pack ID doesn't match pack URL.</p>{{/if}}
        </div>

        <div class="field">
          <div class="den-row">
            <label class="label is-small">Tiger <span class="has-text-grey-light">— 1st Grade</span></label>
            <div class="den-num-wrap"><label class="label is-small">Den #</label>
            <input class="input is-small den-num" type="number" min="1" max="99" placeholder="1" value="{{tigerDenNum}}"></div>
          </div>
          <div class="control">
            <input class="input is-small {{validation.tiger.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
              value="{{tigerUrl}}">
          </div>
          {{#if validation.tiger.mismatch}}<p class="help is-danger">Pack ID doesn't match pack URL.</p>{{/if}}
        </div>

        <div class="field">
          <div class="den-row">
            <label class="label is-small">Wolf <span class="has-text-grey-light">— 2nd Grade</span></label>
            <div class="den-num-wrap"><label class="label is-small">Den #</label>
            <input class="input is-small den-num" type="number" min="1" max="99" placeholder="1" value="{{wolfDenNum}}"></div>
          </div>
          <div class="control">
            <input class="input is-small {{validation.wolf.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
              value="{{wolfUrl}}">
          </div>
          {{#if validation.wolf.mismatch}}<p class="help is-danger">Pack ID doesn't match pack URL.</p>{{/if}}
        </div>

        <div class="field">
          <div class="den-row">
            <label class="label is-small">Bear <span class="has-text-grey-light">— 3rd Grade</span></label>
            <div class="den-num-wrap"><label class="label is-small">Den #</label>
            <input class="input is-small den-num" type="number" min="1" max="99" placeholder="1" value="{{bearDenNum}}"></div>
          </div>
          <div class="control">
            <input class="input is-small {{validation.bear.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
              value="{{bearUrl}}">
          </div>
          {{#if validation.bear.mismatch}}<p class="help is-danger">Pack ID doesn't match pack URL.</p>{{/if}}
        </div>

        <div class="field">
          <div class="den-row">
            <label class="label is-small">Webelos <span class="has-text-grey-light">— 4th Grade</span></label>
            <div class="den-num-wrap"><label class="label is-small">Den #</label>
            <input class="input is-small den-num" type="number" min="1" max="99" placeholder="1" value="{{webelosDenNum}}"></div>
          </div>
          <div class="control">
            <input class="input is-small {{validation.webelos.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
              value="{{webelosUrl}}">
          </div>
          {{#if validation.webelos.mismatch}}<p class="help is-danger">Pack ID doesn't match pack URL.</p>{{/if}}
        </div>

        <div class="field mb-0">
          <div class="den-row">
            <label class="label is-small">Arrow of Light <span class="has-text-grey-light">— 5th Grade</span></label>
            <div class="den-num-wrap"><label class="label is-small">Den #</label>
            <input class="input is-small den-num" type="number" min="1" max="99" placeholder="1" value="{{aolDenNum}}"></div>
          </div>
          <div class="control">
            <input class="input is-small {{validation.aol.cls}}" type="text"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
              value="{{aolUrl}}">
          </div>
          {{#if validation.aol.mismatch}}<p class="help is-danger">Pack ID doesn't match pack URL.</p>{{/if}}
        </div>
      </div>

      <div class="box">
        <h2 class="title is-6 mb-3">Your Link</h2>
        {{#if hasOutput}}
          <div class="url-display mb-3">{{generatedUrl}}</div>
          <button class="button is-small is-light" id="copy-btn" on-click="copy">Copy Link</button>
        {{else}}
          <p class="has-text-grey is-size-6">Paste the pack calendar URL above to generate a link.</p>
        {{/if}}
        {{#if hasOutput}}
          <div class="field mt-4">
            <label class="label is-small">Top Border Text (optional)</label>
            <div class="control">
              <input class="input is-small" type="text" maxlength="40" placeholder="e.g. PACK 3721" value="{{borderTopText}}">
            </div>
          </div>
          <div class="field mb-0">
            <label class="label is-small">Bottom Border Text (optional)</label>
            <div class="control">
              <input class="input is-small" type="text" maxlength="40" placeholder="e.g. SCAN TO SUBSCRIBE" value="{{borderBottomText}}">
            </div>
          </div>
        {{/if}}
        <div id="qr-container" class="qr-wrap mt-4"></div>
        {{#if hasOutput}}
          <p class="help has-text-centered mt-2">Share or print this QR code — families pick their own rank(s)</p>
          <div class="has-text-centered mt-2">
            <button class="button is-small is-light" id="save-png-btn" on-click="savePng">Save PNG</button>
          </div>
        {{/if}}
      </div>

      {{#if hasOutput}}
      <div class="box">
        <h2 class="title is-6 mb-3">Encrypted Link (optional)</h2>
        <p class="help mb-3">
          Use this instead of the plain link above if you want to be able to update the
          calendar info later without reprinting the QR code, and without the pack/den
          data sitting in the repo in plain text. It requires manually committing a file
          to this repo each time you generate or update it.
        </p>
        <h3 class="title is-7 mb-2">Full Year at a Glance (optional)</h3>
        <p class="help mb-3">
          Link to a full-year plan — a Google Doc, PDF, whatever's easiest. Shown as an
          extra step on the subscription page once someone's picked their den(s).
        </p>
        <div class="field">
          <label class="label is-small">Pack Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://docs.google.com/..." value="{{packDocUrl}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Lion Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://..." value="{{lionDocUrl}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Tiger Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://..." value="{{tigerDocUrl}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Wolf Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://..." value="{{wolfDocUrl}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Bear Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://..." value="{{bearDocUrl}}">
          </div>
        </div>
        <div class="field">
          <label class="label is-small">Webelos Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://..." value="{{webelosDocUrl}}">
          </div>
        </div>
        <div class="field mb-0">
          <label class="label is-small">Arrow of Light Doc Link</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="https://..." value="{{aolDocUrl}}">
          </div>
        </div>
        <hr>
        <div class="field">
          <label class="label is-small">File ID</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="e.g. pack123" value="{{fileId}}">
          </div>
          <p class="help">Pick any short id — it becomes the filename, not a secret.</p>
        </div>
        <div class="field">
          <label class="label is-small">Encryption Key</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="Generated automatically, or paste one back in" value="{{encryptionKey}}">
          </div>
          <p class="help">
            Saved on this device so you can reuse it to update this file later — reusing the
            same key and file ID keeps already-printed QR codes and links working. Pasting in
            a different key switches which one gets used next.
          </p>
        </div>
        <div class="buttons">
          <button class="button is-small is-light" on-click="encrypt" disabled="{{encryptBusy}}">
            {{encryptBusy ? 'Encrypting…' : 'Generate Encrypted File'}}
          </button>
          <button class="button is-small is-light" on-click="generateKey">Generate New Key</button>
        </div>
        <p class="help is-warning mb-0">
          ⚠ Generating a new key breaks every QR code/link already made with the old one — only
          do this if you're starting over, not when updating existing calendar info.
        </p>
        {{#if encryptError}}
          <p class="help is-danger mt-2">{{encryptError}}</p>
        {{/if}}
        {{#if encryptedFile}}
          <div class="field mt-4">
            <label class="label is-small">Save as <code>data/{{fileId}}.json</code> in the repo</label>
            <div class="control">
              <textarea class="textarea is-small" rows="3" readonly>{{encryptedFile}}</textarea>
            </div>
            <div class="buttons mt-2">
              <button class="button is-small is-light" id="copy-enc-file-btn" on-click="copyEncFile">Copy JSON</button>
              <button class="button is-small is-light" on-click="downloadEncFile">Download JSON</button>
            </div>
          </div>
          <div class="field mt-4 mb-0">
            <label class="label is-small">Link (share only after the file above is committed)</label>
            <div class="url-display mb-3">{{encryptedUrl}}</div>
            <button class="button is-small is-light" id="copy-enc-url-btn" on-click="copyEncUrl">Copy Link</button>
          </div>
          <div id="qr-container-enc" class="qr-wrap mt-4"></div>
          <p class="help has-text-centered mt-2">QR code for the link above — don't share it until the file is committed</p>
          <div class="has-text-centered mt-2">
            <button class="button is-small is-light" on-click="savePngEnc">Save PNG</button>
          </div>
        {{/if}}
      </div>
      {{/if}}

    </div>
  </section>
{% endraw %}
</script>

<div id="app"></div>

<footer class="footer">
  <p>Calendar subscriptions powered by <a href="https://advancements.scouting.org/" target="_blank">Scoutbook+</a></p>
  <div class="has-text-centered mt-2">
    <a href="{{ site.github.repository_url }}" target="_blank" title="View on GitHub"
      style="display: inline-flex; align-items: center;">
      <img src="https://img.shields.io/badge/github-{{ site.github.repository_name | replace: '-', '--' }}-blue?logo=github"
        alt="GitHub Repo Badge">
    </a>
    <a href="{{ site.github.repository_url }}/commit/{{ site.github.build_revision }}" target="_blank"
      title="Build {{ site.github.build_revision | default: 'dev' }}"
      style="display: inline-flex; align-items: center; margin-left: 0.4em;">
      <img src="https://img.shields.io/badge/build-{{ site.github.build_revision | default: 'dev' | slice: 0, 7 }}-lightgrey"
        alt="Build version badge">
    </a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/ractive@1.4.4/ractive.min.js"></script>
<script type="module" src="{{ '/generate/main.js' | relative_url }}?v={{ site.github.build_revision }}"></script>
</body>
</html>
