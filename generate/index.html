<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Subscription Link</title>
  <style>html, body { background: #ffffff; margin: 0; }</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body>

<header class="scout-header">
  <span class="fleur">⚜</span>
  <h1>Generate Subscription Link</h1>
</header>

<script id="generator-template" type="text/ractive">
  <section class="section pb-2">
    <div class="container" style="max-width: 600px;">

      <div class="box">
        <h2 class="title is-6 mb-3">Pack Info</h2>

        <div class="field">
          <label class="label is-small">Pack Name</label>
          <div class="control">
            <input class="input is-small" type="text" placeholder="e.g. Pack 3721"
              value="{{packName}}" on-input="@this.set('packName', @node.value)">
          </div>
        </div>

        <div class="field">
          <label class="label is-small">Pack Calendar URL</label>
          <div class="control">
            <input class="input is-small" type="url"
              placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX"
              value="{{packUrl}}" on-input="@this.set('packUrl', @node.value)">
          </div>
        </div>
      </div>

      <div class="box">
        <h2 class="title is-6 mb-3">Den Calendar URLs</h2>
        <p class="help mb-4">Leave blank for any dens that don't have a calendar yet.</p>

        {{#each ranks}}
          <div class="field">
            <label class="label is-small">{{label}} <span class="has-text-grey-light">— {{grade}}</span></label>
            <div class="control">
              <input class="input is-small" type="url"
                placeholder="https://api.scouting.org/advancements/events/calendar/XXXXX/YYYYY"
                value="{{~/denUrls[slug]}}"
                on-input="@this.set('denUrls.' + slug, @node.value)">
            </div>
          </div>
        {{/each}}
      </div>

      <div class="box">
        <h2 class="title is-6 mb-3">Generate Link</h2>

        <div class="field">
          <label class="label is-small">Select Rank</label>
          <div class="control">
            <div class="select is-fullwidth is-small">
              <select value="{{selectedRank}}" on-change="@this.set('selectedRank', @node.value)">
                <option value="">— Choose a rank —</option>
                {{#each ranks}}
                  <option value="{{slug}}">{{label}} — {{grade}}</option>
                {{/each}}
              </select>
            </div>
          </div>
        </div>

        {{#if hasOutput}}
          <div class="generator-output mt-4">
            <p class="label is-small mb-2">Subscription Link</p>
            <div class="url-display mb-3">{{generatedUrl}}</div>
            <button class="button is-small is-light" id="copy-btn" on-click="copyUrl()">
              Copy Link
            </button>

            <div class="qr-wrap mt-4">
              <img src="{{qrUrl}}" width="200" height="200" alt="QR code for subscription link">
            </div>
            <p class="help has-text-centered mt-2">Share or print this QR code for {{rankLabel}} families</p>
          </div>
        {{else}}
          <p class="help has-text-grey">Enter at least one calendar URL and select a rank to generate a link.</p>
        {{/if}}

      </div>
    </div>
  </section>
</script>

<div id="app"></div>

<footer class="footer">
  <p>Calendar subscriptions powered by <a href="https://scoutbook.scouting.org" target="_blank">Scoutbook</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/ractive@1.4.4/ractive.min.js"></script>
<script src="{{ '/generate/main.js' | relative_url }}?v={{ site.github.build_revision }}"></script>
</body>
</html>
