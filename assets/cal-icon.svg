<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68">
  <!--
    Color variables — edit these four values to restyle the icon:
      background : white
      body       : #003F87  (BSA blue)
      header     : #FFC72C  (BSA gold)
      days       : white
  -->

  <!-- white background -->
  <rect width="64" height="68" rx="10" fill="white"/>

  <!-- calendar body -->
  <rect x="6" y="14" width="52" height="50" rx="6" fill="#003F87"/>

  <!-- header bar (gold) -->
  <rect x="6" y="14" width="52" height="18" rx="6" fill="#FFC72C"/>
  <!-- square off the bottom corners of the header -->
  <rect x="6" y="24" width="52" height="8" fill="#FFC72C"/>

  <!-- binding rings -->
  <rect x="19" y="6" width="7" height="16" rx="3.5" fill="#003F87"/>
  <rect x="38" y="6" width="7" height="16" rx="3.5" fill="#003F87"/>

  <!-- day grid: 3 cols × 3 rows -->
  <rect x="10" y="37" width="12" height="8" rx="2" fill="white" opacity="0.92"/>
  <rect x="26" y="37" width="12" height="8" rx="2" fill="white" opacity="0.92"/>
  <rect x="42" y="37" width="12" height="8" rx="2" fill="white" opacity="0.92"/>

  <rect x="10" y="48" width="12" height="8" rx="2" fill="white" opacity="0.92"/>
  <rect x="26" y="48" width="12" height="8" rx="2" fill="white" opacity="0.92"/>
  <rect x="42" y="48" width="12" height="8" rx="2" fill="white" opacity="0.92"/>

  <rect x="10" y="58" width="12" height="6" rx="2" fill="white" opacity="0.92"/>
  <rect x="26" y="58" width="12" height="6" rx="2" fill="white" opacity="0.92"/>
</svg>
